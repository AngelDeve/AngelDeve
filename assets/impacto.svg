<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img" aria-labelledby="title"><title id="title">Trayectoria desde 2020; tres componentes críticos en mi etapa como líder técnico; cinco ingenieros en el equipo de soporte que coordiné.</title><defs></defs><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><rect x="1" y="1" width="410" height="208" rx="18" fill="#101e30" stroke="#293f58"/><text x="30" y="40" font-size="17" fill="#93c5fd" font-weight="400" letter-spacing="2">TRAYECTORIA</text><text x="26" y="115" font-size="68" fill="#93c5fd" font-weight="700" letter-spacing="-2">2020</text><text x="30" y="153" font-size="23" fill="#e1eaf5" font-weight="600" >El inicio de mi recorrido</text><text x="30" y="183" font-size="19" fill="#98aec8" font-weight="400" >Desarrollo, soporte y operación</text><rect x="435" y="1" width="410" height="208" rx="18" fill="#10252d" stroke="#2b5055"/><text x="464" y="40" font-size="17" fill="#5eead4" font-weight="400" letter-spacing="2">LIDERAZGO TÉCNICO</text><text x="460" y="115" font-size="68" fill="#5eead4" font-weight="700" letter-spacing="-2">03</text><text x="464" y="153" font-size="23" fill="#e1eaf5" font-weight="600" >Componentes críticos</text><text x="464" y="183" font-size="19" fill="#98aec8" font-weight="400" >Bajo mi liderazgo en KS Soluciones</text><rect x="869" y="1" width="410" height="208" rx="18" fill="#1b2037" stroke="#3d4164"/><text x="898" y="40" font-size="17" fill="#c4b5fd" font-weight="400" letter-spacing="2">GESTIÓN DE EQUIPO</text><text x="894" y="115" font-size="68" fill="#c4b5fd" font-weight="700" letter-spacing="-2">05</text><text x="898" y="153" font-size="23" fill="#e1eaf5" font-weight="600" >Ingenieros de soporte</text><text x="898" y="183" font-size="19" fill="#98aec8" font-weight="400" >En el equipo que coordiné</text></g></svg>